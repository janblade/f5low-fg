name: ci

on:
  push:
  pull_request:

jobs:
  audit-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build number = commit count

      # Intel's public XeSS SDK, headers only (the version OptiScaler pins). Read at build time, never copied in.
      - uses: actions/checkout@v5
        with:
          repository: intel/xess
          ref: v3.0.2
          path: _xess
          sparse-checkout: inc/xess_fg
          sparse-checkout-cone-mode: false

      # NVIDIA's public Streamline SDK, headers only (MIT; the version OptiScaler pins). The dlssg generator compiles against them;
      # Streamline itself (sl.*.dll, nvngx_dlssg.dll) is the player's own and never part of the build.
      - uses: actions/checkout@v5
        with:
          repository: NVIDIA-RTX/Streamline
          ref: v2.11.1
          path: _streamline
          sparse-checkout: /include/
          sparse-checkout-cone-mode: false

      - name: Audit self test
        run: python tools/audit.py --self-test

      - name: Audit repo (no vendor content)
        run: python tools/audit.py

      # build.ps1 generates our kernels at build time: numpy (noise texture) and dxc.exe (Windows SDK on the runner)
      - name: Build tools
        run: python -m pip install numpy

      - name: Build f5low.dll (no pack)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./build.ps1 -VsPath $vs -XessInc "$PWD\_xess\inc\xess_fg" -StreamlineInc "$PWD\_streamline\include"

      # The unlock families' own tests on synthetic images (no NVIDIA file is involved; the checkers and probes that read the
      # player's DLSS-G files are built too, not run)
      - name: Unlock tests
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_mfgunlock_tests.ps1 -VsPath $vs
          ./build/mfgunlock_core_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "mfgunlock_core_smoke failed" }

      # The PaceLead rule (src/pace_lead.h) on the host: no GPU
      - name: Pace lead test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_pace_lead_test.ps1 -VsPath $vs

      # The begin / end pairing of the timer raise (src/timer_raise.h): no GPU
      - name: Timer raise test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_timer_raise_test.ps1 -VsPath $vs

      # The schedule pieces shared by the own generator and the intel sink (src/pace_sched.h): no GPU
      - name: Pace schedule test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_pace_sched_test.ps1 -VsPath $vs

      # LateGen=drop's decision (src/pace_sched.h DropLate): no GPU
      - name: Drop late generated frames test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_drop_late_test.ps1 -VsPath $vs

      # LateGen=auto's next-frame rules and LateGen=compress (src/pace_sched.h): no GPU
      - name: Next frame pacing test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_compress_late_test.ps1 -VsPath $vs

      # The out of band queue and marker rules (src/oob_driver.h): no GPU
      - name: Out of band driver test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_oob_driver_test.ps1 -VsPath $vs

      # The sink's per-frame release rule, display-paced and SinkPace=off (src/sink/release_rule.h): no GPU
      - name: Sink release rule test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_release_rule_test.ps1 -VsPath $vs

      # The sink's DXGI wrappers refuse Streamline's real-object IID (src/sink/scproxy.h): no GPU
      - name: Sink IID test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_sink_iid_test.ps1 -VsPath $vs

      # The NVAPI kernel container rewrite (src/unlock/NvapiFatbin.h) on synthetic fatbin containers: no GPU, no NVIDIA file
      - name: NVAPI fatbin test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_nvapi_fatbin_test.ps1 -VsPath $vs

      # Which nvngx_dlssg is ours (src/generators/dlssg_own.h): paths in, verdict out, no GPU
      - name: DLSS-G own module test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./tests/build_dlssg_own_test.ps1 -VsPath $vs

      # The motion / depth format conversion (src/xefg_convert.hlsl, every kind against exact values) on WARP and the format table
      # (src/xefg_formats.h): no NVIDIA GPU, no pack
      - name: Format conversion test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./scripts/build_convert_test.ps1 -VsPath $vs

      - name: Audit the DLL (only what we compile in)
        run: python tools/audit.py --dll build/f5low.dll
