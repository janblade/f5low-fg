name: ci

on:
  push:
  pull_request:

jobs:
  audit-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      # Intel's public XeSS SDK, headers only (the version OptiScaler pins). Read at build time, never copied in.
      - uses: actions/checkout@v4
        with:
          repository: intel/xess
          ref: v3.0.2
          path: _xess
          sparse-checkout: inc/xess_fg
          sparse-checkout-cone-mode: false

      - name: Audit self test
        run: python tools/audit.py --self-test

      - name: Audit repo (no vendor content)
        run: python tools/audit.py

      - name: Build f5low.dll (no pack)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          ./build.ps1 -VsPath $vs -XessInc "$PWD\_xess\inc\xess_fg"

      - name: Audit the DLL (only what we compile in)
        run: python tools/audit.py --dll build/f5low.dll
